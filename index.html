<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Screening Link Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-4">Generate Screening Link</h1>
  <input id="phone" type="tel" placeholder="+1234567890" class="w-full p-2 border mb-4">
  <button onclick="generateLink()" class="w-full bg-blue-500 text-white p-2 rounded">Generate Link</button>
  <div id="result" class="mt-4 hidden">
    <p>Share this link:</p>
    <a id="link" class="font-mono bg-gray-100 p-2 block"></a>
  </div>

  <script>
    function generateLink() {
      const phone = document.getElementById('phone').value;
      if (!phone) return alert('Enter phone');
      fetch('/generate-link', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({phone})
      }).then(res => res.json()).then(data => {
        document.getElementById('link').textContent = data.link;
        document.getElementById('result').classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
